<text x="24" y="66" fill="#7fc492">$ <tspan fill="#f3f0e8">shelf --help</tspan></text>
<text x="24" y="86" fill="#d8d3c8" xml:space="preserve">Usage: shelf [options] [command]</text>
<text x="24" y="106" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="126" fill="#d8d3c8" xml:space="preserve">object-storage / file-handling / CDN / uploads employee — presigned POST &gt; PUT,</text>
<text x="24" y="146" fill="#d8d3c8" xml:space="preserve">magic-byte validation, abort-incomplete-multipart day-one, egress-first cost.</text>
<text x="24" y="166" fill="#d8d3c8" xml:space="preserve">Powered by Energy.</text>
<text x="24" y="186" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="206" fill="#d8d3c8" xml:space="preserve">Options:</text>
<text x="24" y="226" fill="#d8d3c8" xml:space="preserve">  -v, --version               print the shelf version</text>
<text x="24" y="246" fill="#d8d3c8" xml:space="preserve">  --json                      emit machine-readable JSON (on data commands)</text>
<text x="24" y="266" fill="#d8d3c8" xml:space="preserve">                              (default: false)</text>
<text x="24" y="286" fill="#d8d3c8" xml:space="preserve">  -h, --help                  display help for command</text>
<text x="24" y="306" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="326" fill="#d8d3c8" xml:space="preserve">Commands:</text>
<text x="24" y="346" fill="#d8d3c8" xml:space="preserve">  presign                     mint presigned upload/download URLs</text>
<text x="24" y="366" fill="#d8d3c8" xml:space="preserve">  upload [options] &lt;file&gt;     the bar: validate → presign POST → upload → HEAD</text>
<text x="24" y="386" fill="#d8d3c8" xml:space="preserve">                              re-validate (random key if --key omitted)</text>
<text x="24" y="406" fill="#d8d3c8" xml:space="preserve">  get [options] &lt;key&gt;         fetch an object via a signed URL (the round-trip</text>
<text x="24" y="426" fill="#d8d3c8" xml:space="preserve">                              read side)</text>
<text x="24" y="446" fill="#d8d3c8" xml:space="preserve">  validate [options] &lt;file&gt;   validate an upload by magic bytes +</text>
<text x="24" y="466" fill="#d8d3c8" xml:space="preserve">                              resource-consumption caps (refuses</text>
<text x="24" y="486" fill="#d8d3c8" xml:space="preserve">                              SVG-from-untrusted)</text>
<text x="24" y="506" fill="#d8d3c8" xml:space="preserve">  brain [options] &lt;query...&gt;  BM25 ranked search over the expertise brain</text>
<text x="24" y="526" fill="#d8d3c8" xml:space="preserve">                              (brain/*.md) — returns the matched S-/P-/O- node</text>
<text x="24" y="546" fill="#d8d3c8" xml:space="preserve">  lifecycle                   bucket lifecycle hygiene (the day-one rule)</text>
<text x="24" y="566" fill="#d8d3c8" xml:space="preserve">  cost                        storage cost estimation (egress-first)</text>
<text x="24" y="586" fill="#d8d3c8" xml:space="preserve">…</text>
