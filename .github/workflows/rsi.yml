name: shelf RSI
# D2 (a): runs the DETERMINISTIC ($0, tokenless) RSI loop — refresh-brain → re-verify-tool-matrix +
# drift-watch (R2/S3 pricing, boto3 content-length-range V-04, tusd patch V-10/V-11, CloudFront cap V-09,
# R2-MCP-presign V-12, S3 defaults P-13/P-14, archived-tool P-39) → run-eval-pyramid → propose → test-gate
# → commit-gated. ENABLED (uncommented trigger) — not commented-out (the #1 fleet-gap; CP117: written ≠
# enabled). The deterministic half ships armed now; the CLAUDE half is DEFERRED behind CLAUDE_CODE_OAUTH_TOKEN
# (D8 — a CHAIRMAN-CHECKLIST item; dark is expected, not a miss).
#
# Engine guard: workflows/rsi.workflow.js is delivered by Cluster E (E4). Until it lands the job exits green
# with a clear "engine pending E4" note; the moment it lands, this runs it for real with no edit here.
on:
  workflow_dispatch:
  schedule:
    - cron: "33 7 * * *" # daily 07:33 UTC — deterministic drift-watch + eval pyramid

permissions:
  contents: read

jobs:
  rsi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install + build
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm build
      - name: Deterministic RSI loop ($0, tokenless)
        run: |
          if [ ! -f workflows/rsi.workflow.js ]; then
            echo "::warning::RSI engine (workflows/rsi.workflow.js) pending Cluster E (E4) — dispatch wired, engine not yet landed."
            exit 0
          fi
          echo "::group::node workflows/rsi.workflow.js --deterministic"
          set -o pipefail
          node workflows/rsi.workflow.js --deterministic | tee rsi-loop.log
          echo "::endgroup::"
      - name: Write the proposal to a file (the loop prints it to the log)
        if: always()
        run: |
          [ -f rsi-loop.log ] || exit 0
          grep -E '^ +• PROPOSE ' rsi-loop.log | sed -E 's/^ +• /- /' > rsi-proposal.md || true
          cat rsi-proposal.md
      - name: Open or update the proposal issue for a person to review
        if: always() && hashFiles('rsi-proposal.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -s rsi-proposal.md ] || { echo "The loop proposed nothing this run, so no issue."; exit 0; }
          gh label create proposal --color 2f5d8a --description "A change the self-improvement loop proposes for a person to review" --force
          {
            echo "Written by the scheduled self-improvement loop on $(date -u '+%Y-%m-%d %H:%M UTC'). It proposes; a person decides. The loop never merges."
            echo
            cat rsi-proposal.md
          } > "$RUNNER_TEMP/proposal-issue.md"
          number=$(gh issue list --label proposal --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/proposal-issue.md"
          else
            gh issue create --title "Shelf: proposal from the self-improvement loop" --label proposal --body-file "$RUNNER_TEMP/proposal-issue.md"
          fi
